<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Smart Ticket Management System</title>

    <link rel="stylesheet"
          href="../css/login.css">

</head>

<body>

    <main class="login-page">

        <section class="left-panel">

            <div class="brand">

                <div class="logo">

                    ST

                </div>

                <h1>Smart Ticket</h1>

                <h2>Management System</h2>

            </div>

            <p>

                Enterprise Ticket Management Platform

            </p>

            <div class="features">

                <p>✔ Secure Login</p>

                <p>✔ Fast Performance</p>

                <p>✔ Easy Management</p>

            </div>

        </section>

        <section class="right-panel">

            <div class="login-card">

                <h2>

                    Welcome Back

                </h2>

                <p>

                    Please login to continue

                </p>

                <form>

                    <div class="input-group">

                        <label>

                            Username

                        </label>

                        <input
                            type="text"
                            id="username"
                            placeholder="Enter Username">

                    </div>

                    <div class="input-group">

                        <label>

                            Password

                        </label>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter Password">

                    </div>

                    <div class="options">

                        <label>

                            <input type="checkbox">

                            Remember Me

                        </label>

                        <a href="#">

                            Forgot Password?

                        </a>

                    </div>

                    <button id="loginBtn">

                        Login

                    </button>

                </form>

            </div>

        </section>

    </main>

    <script src="../js/login.js"></script>

</body>

</html>
