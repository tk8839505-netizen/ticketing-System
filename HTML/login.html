<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Ticket Management System</title>

    <link rel="stylesheet" href="../css/login.css">

</head>

<body>

    <main class="login-page">

        <!-- Left Panel -->

        <section class="left-panel">

            <div class="brand">

                <div class="logo">

                    ST

                </div>

                <h1>Smart Ticket</h1>

                <h2>Management System</h2>

                <p>

                    Enterprise Ticket Management Platform

                </p>

            </div>

        </section>

        <!-- Right Panel -->

        <section class="right-panel">

            <div class="login-card">

                <h2>Welcome Back</h2>

                <p>

                    Login to continue

                </p>

                <form id="loginForm">

                    <div class="input-group">

                        <label for="username">

                            Username

                        </label>

                        <input
                            type="text"
                            id="username"
                            placeholder="Enter Username">

                    </div>

                    <div class="input-group">

                        <label for="password">

                            Password

                        </label>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter Password">


                    </div>

                    <div class="options">

                        <label>

                            <input type="checkbox" id="rememberMe">

                            Remember Me

                        </label>

                        <a href="#"  id="forgotPassword">

                            Forgot Password?

                        </a>

                    </div>

                    <button
                        type="submit"
                        id="loginBtn">

                        Login

                    </button>

                    <p id="message"></p>

                </form>

                <!-- Divider -->

                <div class="divider">

                    <span>OR</span>

                </div>

                <!-- Google Button -->

                <button class="google-btn">

                      <img
                         src="https://www.svgrepo.com/show/475656/google-color.svg"
                         alt="Google">

                    Continue with Google

                </button>

                <!-- Signup -->

                <div class="signup">

                    Don't have an account?

                    <a href="signup.html">

                        Create New Account

                    </a>

                </div>

            </div>

        </section>

    </main>
     
    <script src="../js/login.js"></script>

</body>

</html>
